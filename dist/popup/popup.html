<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastiq</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="theme-slate">
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <img src="../icons/icon32.png" width="18" height="18" alt="Pastiq" style="border-radius: 4px; display: block;" />
        </div>
        <div class="brand-meta">
          <span class="brand-title">Pastiq</span>
          <span class="brand-sub">Local Memory</span>
        </div>
      </div>

      <div class="header-tools">
        <button id="btn-toggle-capture" class="header-icon-btn" title="Pause / Resume Clipboard Capture" aria-label="Toggle capture">
          <span class="status-dot"></span>
        </button>
        <button id="btn-open-settings" class="header-icon-btn" title="Open Settings" aria-label="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Section -->
    <div class="search-wrap">
      <div class="search-box">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Search anything... (or /page, /tab)"
          autofocus
          autocomplete="off"
          spellcheck="false"
        />
        <div class="search-right-badge">
          <button id="btn-clear-search" class="clear-btn" title="Clear">×</button>
          <kbd id="kbd-shortcut-hint">Ctrl K</kbd>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-tab="clips">Clips</button>
      <button class="nav-tab" data-tab="snippets">Snippets</button>
      <button class="nav-tab" data-tab="commands">Commands</button>
    </nav>

    <!-- Inline Snippet Quick Creator -->
    <div id="inline-snippet-creator" class="inline-creator hidden">
      <div class="creator-header">
        <span>Create Reusable Snippet</span>
        <button id="btn-close-creator" class="creator-close">×</button>
      </div>
      <div class="creator-body">
        <input type="text" id="cr-snippet-name" placeholder="Snippet name (e.g. Email Reply)" />
        <input type="text" id="cr-snippet-shortcut" placeholder=";shortcut (e.g. ;email)" />
        <textarea id="cr-snippet-content" rows="3" placeholder="Expanded text content..."></textarea>
        <div class="creator-actions">
          <button id="btn-save-new-snippet" class="btn-primary-sm">Save Snippet</button>
        </div>
      </div>
    </div>

    <!-- Main Results Viewport -->
    <main class="results-viewport" id="results-viewport">
      <!-- Container for unified / sectioned items -->
      <div id="unified-results-container" class="results-flow"></div>

      <!-- Empty State -->
      <div id="empty-state-view" class="empty-state hidden">
        <div class="empty-icon-wrap">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          </svg>
        </div>
        <p class="empty-headline">No clips yet</p>
        <p class="empty-subtext">Copy something to get started, or type a command.</p>
      </div>
    </main>

    <!-- Toast Notification Banner -->
    <div id="toast-pill" class="toast-pill">
      <span class="toast-check">✓</span>
      <span id="toast-text">Copied to clipboard</span>
    </div>

    <!-- Keyboard Navigation Footer -->
    <footer class="app-footer">
      <div class="footer-left">
        <span id="footer-count">0 items</span>
      </div>
      <div class="footer-sync">
        <span class="sync-tag" title="Encrypted cross-device clipboard sync is coming soon in V2">Sync — Coming Soon</span>
      </div>
      <div class="footer-hints">
        <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span><kbd>↵</kbd> Select</span>
        <span><kbd>Esc</kbd></span>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
